name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck · lint · test · web build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Prettier (changed files)
        # The repo predates enforced formatting; only files touched by this
        # change are checked (see server docs/deployment.md §CI).
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # Tag pushes / manual runs have no base (`before` is all zeros): skip
          # rather than diff against the root commit, which checks every file.
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then echo "no base commit (tag or manual run) — skipped"; exit 0; fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.ts' '*.tsx' '*.js' '*.json' | grep -v '^package-lock.json$' || true)
          if [ -n "$files" ]; then echo "$files" | xargs npx prettier --check; else echo "no formattable changes"; fi
      - name: Test
        run: npm test -- --ci
      - name: Web production build
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.bytari.com
          EXPO_PUBLIC_REALTIME_URL: wss://api.bytari.com
          EXPO_PUBLIC_ENVIRONMENT: production
          NODE_ENV: production
        run: npm run build:web

  docker:
    name: Web image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bytari-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (SPA routes + health)
        run: |
          docker run -d --name web -p 8080:8080 bytari-web:ci
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          for path in / /pets /pets/123 /admin/veterinarians /veterinary-offices/abc; do
            curl -fsS -o /dev/null "http://127.0.0.1:8080$path" && echo "ok $path"
          done
          docker rm -f web
