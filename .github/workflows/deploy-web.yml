# Production deploy of Expo Web (https://baytari.com).
#
#   git tag v1.4.0 && git push origin v1.4.0      → CI → web image → VPS deploy
#   Actions → "Deploy Web" → Run workflow          → redeploy a ref manually
#
# Required secrets (environment: production): VPS_HOST, VPS_USER, VPS_SSH_KEY,
# VPS_KNOWN_HOSTS — same values as the server repo. The VPS stack itself
# (compose, nginx, scripts) is shipped by the SERVER repo's deploy workflow;
# this one only swaps the web image.
#
# Optional repository VARIABLES (public values, baked into the bundle):
#   EXPO_PUBLIC_API_BASE_URL (default https://api.baytari.com)
#   EXPO_PUBLIC_REALTIME_URL (default wss://api.baytari.com)
name: Deploy Web

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy-web
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            EXPO_PUBLIC_API_BASE_URL=${{ vars.EXPO_PUBLIC_API_BASE_URL || 'https://api.baytari.com' }}
            EXPO_PUBLIC_REALTIME_URL=${{ vars.EXPO_PUBLIC_REALTIME_URL || 'wss://api.baytari.com' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_USER }}" > ~/.ssh/config
      - name: Deploy
        run: ssh vps "cd /opt/bytari && deploy/scripts/deploy.sh --web-tag '${{ needs.image.outputs.tag }}'"
      - name: Verify from the internet
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://baytari.com/
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://baytari.com/pets
