# Expo Web static server (inside the `web` container, behind the edge proxy).
# TLS, HTTP→HTTPS and security headers are handled by the edge nginx
# (server repo: deploy/nginx/). This server only serves files.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed bundles and assets — cache forever.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Routes. `expo export` writes one HTML shell per route (`/pets.html`,
    # `/pets/[petId].html`, …) and every shell is identical — the client router
    # renders from the URL. So: exact file → `<route>.html` → dir index →
    # fall back to `/index.html` (covers dynamic segments like /pets/123 and
    # deep links opened / refreshed directly). HTML is never cached, so a new
    # deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
